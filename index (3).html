<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에너지 전환과 보존 탐구 - 학습지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F3F4EF; --teal:#2F6F62; --teal-dark:#204D43; --ink:#1F2A33; --ink-soft:#5B6670; --line:#D8DCD3; --amber:#E8A33D;}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Noto Sans KR', sans-serif; padding:40px 16px;}
  .wrap{max-width:520px; margin:0 auto;}
  h1{font-family:'Gowun Dodum', sans-serif; font-weight:400; font-size:24px; color:var(--teal-dark); text-align:center; margin-bottom:6px;}
  p.sub{text-align:center; color:var(--ink-soft); font-size:14px; margin-bottom:28px;}
  a.card{
    display:block; background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:20px 18px; margin-bottom:14px; text-decoration:none; color:var(--ink);
    box-shadow:0 2px 8px rgba(0,0,0,0.05); transition:transform .1s;
  }
  a.card:active{transform:scale(0.98);}
  a.card .tag{font-size:12px; color:var(--amber); font-weight:700;}
  a.card h2{font-family:'Gowun Dodum', sans-serif; font-weight:400; font-size:19px; margin:4px 0 6px; color:var(--teal-dark);}
  a.card p{margin:0; font-size:13.5px; color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">
  <h1>에너지 전환과 보존 탐구</h1>
  <p class="sub">아래에서 차시를 선택해 학습지를 열어주세요.</p>

  <a class="card" href="activity1.html">
    <div class="tag">1차시</div>
    <h2>[활동1] 가전제품 소비전력 비교하기</h2>
    <p>배치도에 가전제품을 놓고 전기에너지 전환과 전력량을 계산해봅시다.</p>
  </a>

  <a class="card" href="activity2.html">
    <div class="tag">2차시</div>
    <h2>[활동2] 전기요금 계산하기</h2>
    <p>전기요금 체계를 알아보고 나의 전기요금을 직접 계산해봅시다.</p>
  </a>
</div>
</body>
</html>
